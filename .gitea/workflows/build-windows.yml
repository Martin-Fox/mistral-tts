name: Build Windows Standalone Executable

on:
  push:
    branches:
      - 'main'
      - 'feat/*'
      - 'release/*'
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: ubuntu-latest
    env:
      WINEARCH: win64
      WINEDEBUG: -all
    steps:
      - name: Check out source code
        run: |
          git config --global --add safe.directory '*' || true
          echo "Checking out repository from https://gitea.marcin-lis.pl/fox/mistral-tts.git..."
          git clone --depth 1 --branch "${{ github.ref_name }}" "https://${{ secrets.GITHUB_TOKEN }}@gitea.marcin-lis.pl/fox/mistral-tts.git" . 2>/dev/null || \
          git clone --depth 1 --branch "${{ github.ref_name }}" "https://gitea.marcin-lis.pl/fox/mistral-tts.git" . 2>/dev/null || \
          git clone --depth 1 "https://${{ secrets.GITHUB_TOKEN }}@gitea.marcin-lis.pl/fox/mistral-tts.git" . 2>/dev/null || \
          git clone --depth 1 "https://gitea.marcin-lis.pl/fox/mistral-tts.git" .

      - name: Download and extract FFmpeg binaries
        run: |
          mkdir -p bin
          if ! command -v unzip >/dev/null 2>&1 || ! command -v zip >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y --no-install-recommends curl unzip zip
            else
              apt-get update && apt-get install -y --no-install-recommends curl unzip zip
            fi
          fi
          echo "Downloading FFmpeg for Windows..."
          curl -L --retry 3 -o ffmpeg.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" || \
          curl -L --retry 3 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          echo "Extracting FFmpeg binaries..."
          unzip -q -o ffmpeg.zip
          find . -name "ffmpeg.exe" -exec cp {} bin/ \;
          find . -name "ffprobe.exe" -exec cp {} bin/ \;
          rm -rf ffmpeg-*-* ffmpeg.zip
          echo "Binaries placed in bin/:"
          ls -la bin/

      - name: Install Wine and Windows Python 3.11
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
          $SUDO dpkg --add-architecture i386 || true
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            wine wine64 ca-certificates curl unzip zip || true
          $SUDO apt-get install -y --no-install-recommends wine32 || true

          wineboot --init
          wineserver -w || true

          echo "Downloading Windows Python 3.11 installer..."
          curl -sSL -o python-installer.exe "https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe"
          echo "Installing Windows Python in Wine..."
          wine python-installer.exe /quiet InstallAllUsers=1 PrependPath=1 Include_test=0
          rm -f python-installer.exe
          wineserver -w || true

          echo "Verifying Wine Python installation..."
          wine python --version

      - name: Install Dependencies and PyInstaller inside Wine
        run: |
          wine python -m pip install --upgrade pip
          wine python -m pip install -r requirements.txt
          wine python -m pip install pyinstaller

      - name: Build Windows Executable with PyInstaller
        run: |
          wine python -m PyInstaller mistral-tts.spec || wine pyinstaller mistral-tts.spec

      - name: Package Release Bundle
        run: |
          mkdir -p dist/mistral-tts/bin
          cp -f bin/ffmpeg.exe dist/mistral-tts/bin/
          cp -f bin/ffprobe.exe dist/mistral-tts/bin/

          # Create run.bat helper launcher with CRLF line endings
          printf '@echo off\r\ncd /d "%%~dp0"\r\necho Starting Mistral-TTS-Booksmith...\r\nmistral-tts.exe\r\npause\r\n' > dist/mistral-tts/run.bat

          cd dist
          zip -r ../mistral-tts-windows-x64.zip mistral-tts/
          cd ..
          echo "Archive generated successfully: mistral-tts-windows-x64.zip"
          ls -lh mistral-tts-windows-x64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistral-tts-windows-x64
          path: mistral-tts-windows-x64.zip
          if-no-files-found: error
