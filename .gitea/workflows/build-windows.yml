name: Build Windows Standalone Executable

on:
  push:
    branches:
      - 'main'
      - 'feat/*'
      - 'release/*'
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download and extract FFmpeg binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path bin
          $ffmpegZip = "ffmpeg.zip"
          try {
              Write-Host "Downloading FFmpeg from Gyan.dev..."
              Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffmpegZip -TimeoutSec 120
          } catch {
              Write-Host "Fallback: Downloading FFmpeg from GitHub releases..."
              Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $ffmpegZip -TimeoutSec 120
          }
          Write-Host "Extracting FFmpeg archive..."
          Expand-Archive -Path $ffmpegZip -DestinationPath ffmpeg-extract -Force
          $ffmpegExe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination bin\ffmpeg.exe -Force
          Copy-Item $ffprobeExe.FullName -Destination bin\ffprobe.exe -Force
          Remove-Item -Recurse -Force ffmpeg-extract, $ffmpegZip
          Write-Host "Binaries placed in bin/:"
          Get-ChildItem bin\

      - name: Build Standalone Executable
        run: |
          pyinstaller mistral-tts.spec

      - name: Package Release Bundle
        shell: powershell
        run: |
          # Ensure bin folder with ffmpeg/ffprobe is inside dist\mistral-tts
          New-Item -ItemType Directory -Force -Path dist\mistral-tts\bin
          Copy-Item -Path bin\* -Destination dist\mistral-tts\bin\ -Force

          # Create run.bat helper launcher
          $batContent = "@echo off`r`ncd /d ""%~dp0""`r`necho Starting Mistral-TTS-Booksmith...`r`nmistral-tts.exe`r`npause`r`n"
          [System.IO.File]::WriteAllText("dist\mistral-tts\run.bat", $batContent, [System.Text.Encoding]::ASCII)

          # Compress to zip
          Compress-Archive -Path dist\mistral-tts\* -DestinationPath mistral-tts-windows-x64.zip -Force
          Write-Host "Archive generated successfully: mistral-tts-windows-x64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistral-tts-windows-x64
          path: mistral-tts-windows-x64.zip
          if-no-files-found: error
