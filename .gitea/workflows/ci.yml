name: Tests and static checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg on Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          else
            apt-get update
            apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Check preinstalled FFmpeg on native Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command ffmpeg -ErrorAction Stop
          Get-Command ffprobe -ErrorAction Stop
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          exit $LASTEXITCODE
      - name: Install locked development dependencies
        shell: ${{ matrix.shell }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - name: Check dependency consistency
        shell: ${{ matrix.shell }}
        run: python -m pip check
      - name: Lint
        shell: ${{ matrix.shell }}
        run: python -m ruff check src tests scripts
      - name: Run isolated offline tests
        shell: ${{ matrix.shell }}
        run: python -m pytest -q --durations=10 --junitxml=test-results.xml
      - name: Run portable release smoke in a Unicode checkout
        shell: ${{ matrix.shell }}
        run: python scripts/platform_smoke.py
      - name: Test runtime Docker image
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: python scripts/docker_smoke.py
